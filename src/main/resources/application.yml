spring:
  application:
    name: support-ticket-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/support_ticket}
    username: ${DB_USERNAME:support}
    password: ${DB_PASSWORD:support}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

app:
  security:
    jwt-secret: ${JWT_SECRET:change-this-development-secret-at-least-32-bytes}
    access-token-ttl: PT1H
  storage:
    location: ${STORAGE_LOCATION:./uploads}
  bootstrap:
    admin-email: ${ADMIN_EMAIL:admin@example.com}
    admin-password: ${ADMIN_PASSWORD:Admin123!}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints.web.exposure.include: health,info,metrics
  endpoint.health.show-details: when_authorized
